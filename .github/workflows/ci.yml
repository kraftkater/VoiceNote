name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        # Only what the pure-logic tests import; sounddevice/keyboard/pyperclip are stubbed in tests/conftest.py.
        run: python -m pip install pytest ruff numpy
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile and build the release archive
        run: |
          python -m compileall -q .
          python tools/build_release.py
