name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check that the tag matches VERSION
        run: |
          test "v$(cat VERSION | tr -d '[:space:]')" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match VERSION"; exit 1; }
      - name: Build archive
        run: python tools/build_release.py
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VoiceNote-*.zip
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
